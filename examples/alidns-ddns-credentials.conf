# 放到 /etc/systemd/system/alidns-ddns.service.d/credentials.conf
# 或合并进 alidns-ddns.service / alidns-ddns-once.service 的 [Service] 段。
#
# 要求 systemd >= 247。源文件由 root 创建并保持 600，
# systemd 以 root 读取后挂载到服务的 $CREDENTIALS_DIRECTORY，
# 服务进程（DynamicUser）无需自己读这些源文件。
#
# 程序读取的文件名固定为：
#   alidns-access-key-id
#   alidns-access-key-secret
# 优先级：CLI > LoadCredential > 环境变量 > config.json

[Service]
LoadCredential=alidns-access-key-id:/etc/alidns-ddns/access_key_id
LoadCredential=alidns-access-key-secret:/etc/alidns-ddns/access_key_secret
