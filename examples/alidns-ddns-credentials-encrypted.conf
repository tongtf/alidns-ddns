# 可选方案：加密凭据（LoadCredentialEncrypted）
# 放到 /etc/systemd/system/alidns-ddns.service.d/credentials.conf
# 与 examples/alidns-ddns-credentials.conf（明文凭据）二选一，不要同时启用。
#
# systemd 在启动服务时解密并鉴权，然后仍以明文形式挂载到
# $CREDENTIALS_DIRECTORY/alidns-access-key-id
# $CREDENTIALS_DIRECTORY/alidns-access-key-secret
# 本程序不需要任何改动。
#
# 要求 systemd >= 247（systemd-creds 工具 >= 250）。
# 先用 systemd-creds encrypt 生成 .cred 文件，凭据名必须与下面 ID 完全一致：
#
#   printf '%s' 'AKID' | sudo systemd-creds encrypt --with-key=host \
#     --name=alidns-access-key-id - /etc/alidns-ddns/alidns-access-key-id
#   printf '%s' 'SECRET' | sudo systemd-creds encrypt --with-key=host \
#     --name=alidns-access-key-secret - /etc/alidns-ddns/alidns-access-key-secret

[Service]
LoadCredentialEncrypted=alidns-access-key-id:/etc/alidns-ddns/alidns-access-key-id
LoadCredentialEncrypted=alidns-access-key-secret:/etc/alidns-ddns/alidns-access-key-secret
