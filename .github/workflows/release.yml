name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.1.0）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Linux 三平台：x86_64 / aarch64 / armv7（apt 交叉工具链，ring 需要对应 gcc） ---
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
            linker: ""
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 安装交叉编译工具链
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: 构建
        run: |
          set -euo pipefail
          args=(--release --target "${{ matrix.target }}")
          if [ -n "${{ matrix.linker }}" ]; then
            args+=(--config "target.${{ matrix.target }}.linker=\"${{ matrix.linker }}\"")
          fi
          cargo build "${args[@]}"
      - name: 打包
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          cd "target/${{ matrix.target }}/release"
          tar -czf "../../../alidns-ddns-${TAG}-${{ matrix.target }}.tar.gz" alidns-ddns
      - uses: actions/upload-artifact@v4
        with:
          name: alidns-ddns-${{ matrix.target }}
          path: alidns-ddns-*.tar.gz
          if-no-files-found: error

  # --- macOS arm64（Apple Silicon），需在 macOS runner 上链接 SDK ---
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: 构建
        run: cargo build --release --target aarch64-apple-darwin
      - name: 打包
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          cd "target/aarch64-apple-darwin/release"
          tar -czf "../../../alidns-ddns-${TAG}-aarch64-apple-darwin.tar.gz" alidns-ddns
      - uses: actions/upload-artifact@v4
        with:
          name: alidns-ddns-aarch64-apple-darwin
          path: alidns-ddns-*.tar.gz
          if-no-files-found: error

  # --- 汇总附件，创建 GitHub Release ---
  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 展示产物
        run: ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
