name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: alidns-ddns-linux-amd64
            os: ubuntu-latest
            packages: ""
            linker: ""
          - target: aarch64-unknown-linux-gnu
            artifact: alidns-ddns-linux-arm64
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: armv7-unknown-linux-gnueabihf
            artifact: alidns-ddns-linux-armv7
            os: ubuntu-latest
            packages: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
          - target: aarch64-apple-darwin
            artifact: alidns-ddns-darwin-arm64
            os: macos-latest
            packages: ""
            linker: ""
          - target: x86_64-apple-darwin
            artifact: alidns-ddns-darwin-amd64
            os: macos-latest
            packages: ""
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build
        run: |
          set -euo pipefail
          args=(--release --target "${{ matrix.target }}")
          if [ -n "${{ matrix.linker }}" ]; then
            args+=(--config "target.${{ matrix.target }}.linker=\"${{ matrix.linker }}\"")
          fi
          cargo build "${args[@]}"

      - name: Compress with UPX
        if: contains(matrix.target, 'unknown-linux')
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best target/${{ matrix.target }}/release/alidns-ddns

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz alidns-ddns
          cd ../../../
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## alidns-ddns ${{ github.ref_name }}

            轻量级阿里云 DDNS 工具 — 单文件 Rust 实现，专注阿里云 DNS。

            ### 下载

            | 平台 | 文件 | 校验和 |
            |------|------|--------|
            | Linux x86_64 | `alidns-ddns-linux-amd64.tar.gz` | `.sha256` |
            | Linux ARM64 | `alidns-ddns-linux-arm64.tar.gz` | `.sha256` |
            | Linux ARMv7 (armhf) | `alidns-ddns-linux-armv7.tar.gz` | `.sha256` |
            | macOS Apple Silicon | `alidns-ddns-darwin-arm64.tar.gz` | `.sha256` |
            | macOS Intel | `alidns-ddns-darwin-amd64.tar.gz` | `.sha256` |

            ### 使用

            ```bash
            tar xzf alidns-ddns-linux-amd64.tar.gz
            ./alidns-ddns --domain example.com --rr @ --access-key-id YOUR_KEY --access-key-secret YOUR_SECRET
            ```

            ### 变更

            详见 [commits](https://github.com/tongtf/alidns-ddns/commits/${{ github.ref_name }})
          files: artifacts/*
          generate_release_notes: true
